name: CI

# Runs every test on every push, so a broken rule never reaches the league.
# It can also be started by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type checks, engine tests and security-rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Type checks
        run: npm run typecheck

      - name: Engine tests
        run: npm test

      - name: Security-rule tests (starts the Firestore emulator)
        run: npm run test:rules
