name: Deploy the app

# Publishes the app to GitHub Pages, but only after the CI tests have passed
# on main. It can also be started by hand from the Actions tab ("Run workflow").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Each job below asks for only what it needs on top of this.
permissions:
  contents: read

# One deploy at a time, and never cancel one that is half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the app
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The exact commit the tests passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npm run build

      - name: Hand the built app to the publish job
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  # Publishing is its own job for two reasons. GitHub needs a moment to file
  # the upload before it can be found, and a failed publish can then be re-run
  # on its own from the Actions tab without building twice.
  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
