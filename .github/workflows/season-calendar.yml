name: Keep the season calendar

# Writes each league's season calendar from its settings: the days, when each
# one starts and locks, and when each Rule One arrives. The security rules
# read every deadline from these. It runs every hour, so a change the commish
# makes in season setup is in place within the hour. It can also be started by
# hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: season-calendar
  cancel-in-progress: false

jobs:
  sync:
    name: Write the calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that the league's key is in GitHub Secrets
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The FIREBASE_SERVICE_ACCOUNT secret is not set yet. Skipping."
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'yes'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'yes'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.key.outputs.present == 'yes'

      # The key is handed to this one step only.
      - name: Write the calendar
        if: steps.key.outputs.present == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node jobs/season-calendar.ts
