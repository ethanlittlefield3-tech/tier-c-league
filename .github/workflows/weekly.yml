name: Settle the weeks

# Settles each finished week and keeps the standings. Once a week's Sunday
# locks (noon on Monday) its results post as provisional; at midnight on
# Tuesday they are final. It runs every hour, so results post within the hour.
# It can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  sync:
    name: Settle the weeks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Starting a practice week or a season reset needs to start a workflow, and nothing more.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check that the league's key is in GitHub Secrets
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The FIREBASE_SERVICE_ACCOUNT secret is not set yet. Skipping."
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'yes'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'yes'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.key.outputs.present == 'yes'

      # The key is handed to this one step only.
      - name: Settle the weeks
        if: steps.key.outputs.present == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node jobs/weekly.ts

      # GitHub runs scheduled jobs late, sometimes by an hour, so this job
      # also looks for practice weeks and season resets the commish asked
      # for, as "Send alerts" does: whichever runs first starts them. The key
      # is handed to these two steps only.
      - name: Start or clear practice weeks
        id: practice
        if: steps.key.outputs.present == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node jobs/practice.ts check

      - name: Find season resets to start
        id: reset
        if: steps.key.outputs.present == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node jobs/reset.ts check

      # The workflow's own token starts those jobs; it has no key.
      - name: Start the practice weeks and season resets
        if: steps.practice.outputs.start != '' || steps.reset.outputs.start != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRACTICE: ${{ steps.practice.outputs.start }}
          RESETS: ${{ steps.reset.outputs.start }}
        run: |
          for league in $PRACTICE; do
            gh workflow run practice.yml --repo "$GITHUB_REPOSITORY" -f league="$league"
          done
          for league in $RESETS; do
            gh workflow run reset.yml --repo "$GITHUB_REPOSITORY" -f league="$league"
          done
