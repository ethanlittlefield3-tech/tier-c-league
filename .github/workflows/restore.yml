name: Restore from a backup

# Puts the database back as one morning's backup found it: every document in
# the backup is written back, and every document it doesn't have is deleted
# (proof photos aren't in backups, so they stay). It can be limited to one
# league. By hand only, and only with the word "restore" typed in.
on:
  workflow_dispatch:
    inputs:
      date:
        description: The date of the backup to go back to, like 2027-01-31 (backups are made early each morning)
        required: true
      league:
        description: Only this league (its id), or leave empty to restore everything
        required: false
        default: ''
      confirm:
        description: Type restore. This replaces what is in the database now.
        required: true

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  restore:
    name: Restore from a backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check that the keys are in GitHub Secrets
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
          REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          if [ -n "$KEY" ] && [ -n "$TOKEN" ] && [ -n "$REPO" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "The backups repo is not set up yet (FIREBASE_SERVICE_ACCOUNT, BACKUP_REPO and BACKUP_TOKEN). Nothing to restore from."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The token is handed to this step only.
      - name: Open the backups repo, with its history
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_TOKEN }}
          path: backups
          fetch-depth: 0
          persist-credentials: false

      - name: Find the backup from that morning, or the one before
        working-directory: backups
        env:
          DATE: ${{ inputs.date }}
        run: |
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "The date must look like 2027-01-31."
            exit 1
          fi
          # The newest backup made on or before that date. A night with no changes makes no new one.
          found=$(git log --format='%H %s' | awk -v d="$DATE" '$2 == "Backup" && $3 <= d { print $1, $3; exit }')
          if [ -z "$found" ]; then
            echo "There is no backup from $DATE or before."
            exit 1
          fi
          git checkout -q "${found%% *}"
          echo "Using the backup from ${found##* }."

      # The league's key is handed to this step only.
      - name: Restore it
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DIR: backups/snapshot
          RESTORE_CONFIRM: ${{ inputs.confirm }}
          LEAGUE_ID: ${{ inputs.league }}
        run: node jobs/restore.ts
